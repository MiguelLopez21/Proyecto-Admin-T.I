# cupsd.conf de Ecopetrol Bogota. ${ALLOW_SUBNET} lo reemplaza el entrypoint en cada arranque.

LogLevel info
MaxLogSize 0

# Escucha en toda la red del contenedor y en el socket local (lo usan lpadmin/lpstat dentro del contenedor)
Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# Sin ServerAlias, CUPS responde 400 Bad Request cuando llega la IP u otro nombre de host
ServerAlias *

WebInterface Yes
Browsing No
DefaultShared Yes
DefaultEncryption IfRequested

# SystemGroup (lpadmin y root) se define en cups-files.conf, que es donde CUPS 2.x lo lee.

DefaultAuthType Basic

# Control de acceso por subred explicita. No se usa @LOCAL: dentro del contenedor
# solo cubriria la red interna de Docker (172.x) y los clientes (192.168.x) recibirian 403.
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ${ALLOW_SUBNET}
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ${ALLOW_SUBNET}
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from 127.0.0.1
  Allow from ${ALLOW_SUBNET}
</Location>

DefaultPolicy default
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
