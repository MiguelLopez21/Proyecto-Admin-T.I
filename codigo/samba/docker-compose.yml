services:
  samba:
    build: .
    restart: unless-stopped
    ports:
      - "445:445"
      # - "139:139"   # opcional, solo clientes antiguos (requiere quitar "disable netbios" en smb.conf)
    environment:
      SMB_GROUP: ${SMB_GROUP:-administrativa}
      SMB_GID: ${SMB_GID:-3003}
      SMB_USERS: ${SMB_USERS:?define SMB_USERS en .env o en Dokploy}
      SMB_PASSWORD: ${SMB_PASSWORD:?define SMB_PASSWORD en .env o en Dokploy}
    volumes:
      - samba_data:/srv/samba
      - samba_state:/var/lib/samba
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 445 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  samba_data:
  samba_state:
