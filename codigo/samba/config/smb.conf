[global]
   workgroup = ECOPETROL
   server string = Ecopetrol Archivos Bogota
   netbios name = SRV-ECOPETROL

   # Servidor independiente, autenticacion local con base tdbsam
   server role = standalone server
   security = user
   passdb backend = tdbsam

   # Sin invitados (Windows 11 24H2 los bloquea de todas formas)
   map to guest = never

   # Sin SMB1. Firma y cifrado negociados (Windows 11 24H2 exige firma)
   server min protocol = SMB2_10
   server signing = auto
   smb encrypt = desired

   # Logs a stdout para verlos en Docker / Dokploy
   logging = stdout
   log level = 1

   # Las impresoras las maneja CUPS, no Samba
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Solo puerto 445 (sin NetBIOS). Si publicas el 139, quita "disable netbios"
   # y documentalo en el README.
   disable netbios = yes
   smb ports = 445

[administrativa]
   comment = Carpeta compartida oficina Bogota
   path = /srv/samba/administrativa
   valid users = @administrativa
   read only = no
   browseable = yes
   guest ok = no
   force group = administrativa
   create mask = 0660
   directory mask = 2770
